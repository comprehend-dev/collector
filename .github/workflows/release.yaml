name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    uses: ./.github/workflows/tests.yaml

  binaries:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the release archives
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="collector-${version}-${os}-${arch}"
            mkdir "dist/${name}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -ldflags "-X main.version=${version}" -o "dist/${name}/collector" .
            cp LICENSE THIRD-PARTY-LICENSES README.md "dist/${name}/"
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes dist/*.tar.gz dist/SHA256SUMS

  container:
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Packages
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the image
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/collector"
          # The default builder cannot do several architectures at once.
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${version}" \
            --tag "${image}:${version}" \
            --tag "${image}:latest" \
            --push .
